name: Rust

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x64-binary:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y libmp3lame-dev
      - name: Build release
        run: |
          # Resolve the relative path to an absolute path
          export LIB_PATH="${{ github.workspace }}/libs/lame/linux-x64"
          if [ ! -f "$LIB_PATH/libmp3lame.so" ]; then
            echo "Error: libmp3lame.so not found in $LIB_PATH"
            exit 1
          fi
          export LD_LIBRARY_PATH="$LIB_PATH:$LD_LIBRARY_PATH"
          cargo build --verbose --release
      # - name: Run tests
      #   run:  cargo test --verbose
      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: binary-linux
          path: target/release/impulsor3000

  build-windows-x64-binary:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release
        run: cargo build --verbose --release
      # - name: Run tests
      #   run:  cargo test --verbose
      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: binary-windows
          path: ./target/release/impulsor3000.exe

  build-macos-arm64-binary:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release
        run: cargo build --verbose --release
      # - name: Run tests
      #   run: cargo test --verbose
      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: binary-macos-arm64
          path: target/release/impulsor3000

  bundle-macos-arm64-app:
    runs-on: macos-15
    needs: build-macos-arm64-binary

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: binary-macos-arm64
          path: ./target/release

      - name: Build app bundle
        run: |
          APP_NAME="Impulsor-3000.app"
          APP_ROOT="target/release/${APP_NAME}"
          mkdir -p "${APP_ROOT}/Contents/MacOS"
          mkdir -p "${APP_ROOT}/Contents/Resources/libs/lame"
          mkdir -p "${APP_ROOT}/Contents/Resources/libs/pdfium"
          cp installer/macos/Info.plist "${APP_ROOT}/Contents/Info.plist"
          cp target/release/impulsor3000 "${APP_ROOT}/Contents/MacOS/impulsor3000"
          chmod +x "${APP_ROOT}/Contents/MacOS/impulsor3000"
          cp -R libs/lame/mac-arm64 "${APP_ROOT}/Contents/Resources/libs/lame/"
          cp -R libs/pdfium/mac-arm64 "${APP_ROOT}/Contents/Resources/libs/pdfium/"
          cp imgs/logo.png "${APP_ROOT}/Contents/Resources/logo.png"

      - name: Zip app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "target/release/Impulsor-3000.app" \
            "target/release/Impulsor-3000-macos-arm64.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@v6
        with:
          name: app-macos-arm64
          path: target/release/Impulsor-3000-macos-arm64.zip

  build-linux-x64-appimage:
    runs-on: ubuntu-24.04
    needs: build-linux-x64-binary

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/download-artifact@v5
        with:
          name: binary-linux
          path: ./target/release

      - name: Install AppImageTool
        run: |
          sudo apt update && sudo apt install wget file desktop-file-utils -y
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x ./appimagetool-x86_64.AppImage
          mv ./appimagetool-x86_64.AppImage ./installer/linux/appimage/appimagetool-x86_64.AppImage

      - name: Build AppImage
        working-directory: ./installer/linux/appimage
        run: |
          bash setup.sh
          ARCH=x86_64 ./appimagetool-x86_64.AppImage Impulsor-3000-x86_64.AppDir --appimage-extract-and-run
          mv Impulsor-3000-x86_64.AppImage Impulsor-3000_x86-64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: appimage-linux
          path: ./installer/linux/appimage/Impulsor-3000_x86-64.AppImage

  build-windows-x64-installer:
    runs-on: windows-2025
    needs: build-windows-x64-binary

    steps:
      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y

      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/download-artifact@v5
        with:
          name: binary-windows
          path: ./target/release

      - name: Build installer
        working-directory: ./installer/windows
        run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V4 .\script.nsi'

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: installer-windows
          path: ./installer/windows/impulsor3000_setup.exe
