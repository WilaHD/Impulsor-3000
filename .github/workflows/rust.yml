name: Rust

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x64-binary:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release
        run: cargo build --verbose --release
      # - name: Run tests
      #   run:  cargo test --verbose
      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: binary-linux
          path: target/release/impulsor3000

  build-windows-x64-binary:
    runs-on: windows-2025

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release
        run: cargo build --verbose --release
      # - name: Run tests
      #   run:  cargo test --verbose
      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: binary-windows
          path: ./target/release/impulsor3000.exe

  build-macos-arm64-binary:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build release
        run: cargo build --verbose --release
      # - name: Run tests
      #   run: cargo test --verbose
      - name: Upload binary
        uses: actions/upload-artifact@v6
        with:
          name: binary-macos-arm64
          path: target/release/impulsor3000

  bundle-macos-arm64-app:
    runs-on: macos-15
    needs: build-macos-arm64-binary

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: binary-macos-arm64
          path: ./target/release

      - name: Build app bundle
        run: |
          APP_NAME="Impulsor-3000.app"
          APP_ROOT="target/release/${APP_NAME}"
          LAME_DIR="${APP_ROOT}/Contents/Resources/libs/lame/mac-arm64"
          PDFIUM_DIR="${APP_ROOT}/Contents/Resources/libs/pdfium/mac-arm64"
          APP_BIN="${APP_ROOT}/Contents/MacOS/impulsor3000"
          ICONSET_DIR="target/release/AppIcon.iconset"
          mkdir -p "${APP_ROOT}/Contents/MacOS"
          mkdir -p "${APP_ROOT}/Contents/Resources/libs/lame"
          mkdir -p "${APP_ROOT}/Contents/Resources/libs/pdfium"
          mkdir -p "${ICONSET_DIR}"
          cp installer/macos/Info.plist "${APP_ROOT}/Contents/Info.plist"
          cp target/release/impulsor3000 "${APP_BIN}"
          chmod +x "${APP_BIN}"
          cp -R libs/lame/mac-arm64 "${APP_ROOT}/Contents/Resources/libs/lame/"
          cp -R libs/pdfium/mac-arm64 "${APP_ROOT}/Contents/Resources/libs/pdfium/"
          cp imgs/logo.png "${APP_ROOT}/Contents/Resources/logo.png"
          sips -z 16 16 imgs/logo.png --out "${ICONSET_DIR}/icon_16x16.png"
          sips -z 32 32 imgs/logo.png --out "${ICONSET_DIR}/icon_16x16@2x.png"
          sips -z 32 32 imgs/logo.png --out "${ICONSET_DIR}/icon_32x32.png"
          sips -z 64 64 imgs/logo.png --out "${ICONSET_DIR}/icon_32x32@2x.png"
          sips -z 128 128 imgs/logo.png --out "${ICONSET_DIR}/icon_128x128.png"
          sips -z 256 256 imgs/logo.png --out "${ICONSET_DIR}/icon_128x128@2x.png"
          sips -z 256 256 imgs/logo.png --out "${ICONSET_DIR}/icon_256x256.png"
          sips -z 512 512 imgs/logo.png --out "${ICONSET_DIR}/icon_256x256@2x.png"
          sips -z 512 512 imgs/logo.png --out "${ICONSET_DIR}/icon_512x512.png"
          cp imgs/logo.png "${ICONSET_DIR}/icon_512x512@2x.png"
          iconutil -c icns "${ICONSET_DIR}" -o "${APP_ROOT}/Contents/Resources/AppIcon.icns"
          install_name_tool -id \
            "@executable_path/../Resources/libs/lame/mac-arm64/libmp3lame.dylib" \
            "${LAME_DIR}/libmp3lame.dylib"
          install_name_tool -id \
            "@loader_path/libpdfium.dylib" \
            "${PDFIUM_DIR}/libpdfium.dylib"
          install_name_tool -change \
            "/opt/homebrew/opt/lame/lib/libmp3lame.0.dylib" \
            "@executable_path/../Resources/libs/lame/mac-arm64/libmp3lame.dylib" \
            "${APP_BIN}"

      - name: Ad-hoc sign app bundle
        run: |
          APP_ROOT="target/release/Impulsor-3000.app"
          APP_BIN="${APP_ROOT}/Contents/MacOS/impulsor3000"
          LAME_LIB="${APP_ROOT}/Contents/Resources/libs/lame/mac-arm64/libmp3lame.dylib"
          PDFIUM_LIB="${APP_ROOT}/Contents/Resources/libs/pdfium/mac-arm64/libpdfium.dylib"

          codesign --force --sign - --timestamp=none "${LAME_LIB}"
          codesign --force --sign - --timestamp=none "${PDFIUM_LIB}"
          codesign --force --sign - --timestamp=none "${APP_BIN}"
          codesign --force --sign - --timestamp=none "${APP_ROOT}"

      - name: Validate bundled libraries
        run: |
          APP_ROOT="target/release/Impulsor-3000.app"
          APP_BIN="${APP_ROOT}/Contents/MacOS/impulsor3000"
          LAME_LIB="${APP_ROOT}/Contents/Resources/libs/lame/mac-arm64/libmp3lame.dylib"
          PDFIUM_LIB="${APP_ROOT}/Contents/Resources/libs/pdfium/mac-arm64/libpdfium.dylib"

          test -f "${APP_BIN}"
          test -f "${LAME_LIB}"
          test -f "${PDFIUM_LIB}"

          echo "Binary dependencies:"
          otool -L "${APP_BIN}"

          echo "LAME dylib install name:"
          otool -D "${LAME_LIB}"

          echo "PDFium dylib install name:"
          otool -D "${PDFIUM_LIB}"

          otool -L "${APP_BIN}" | grep -F "@executable_path/../Resources/libs/lame/mac-arm64/libmp3lame.dylib"
          otool -D "${LAME_LIB}" | grep -F "@executable_path/../Resources/libs/lame/mac-arm64/libmp3lame.dylib"
          otool -D "${PDFIUM_LIB}" | grep -F "@loader_path/libpdfium.dylib"

          echo "Code signatures:"
          codesign --verify --verbose=2 "${LAME_LIB}"
          codesign --verify --verbose=2 "${PDFIUM_LIB}"
          codesign --verify --verbose=2 "${APP_BIN}"
          codesign --verify --deep --strict --verbose=2 "${APP_ROOT}"

          set +e
          DYLD_PRINT_LIBRARIES=1 "${APP_BIN}" > app.stdout 2> app.stderr &
          APP_PID=$!
          sleep 5
          kill "${APP_PID}" 2>/dev/null || true
          wait "${APP_PID}" 2>/dev/null || true
          set -e

          echo "DYLD stderr:"
          cat app.stderr

          grep -F "Contents/Resources/libs/lame/mac-arm64/libmp3lame.dylib" app.stderr
          grep -F "Contents/Resources/libs/pdfium/mac-arm64/libpdfium.dylib" app.stderr

      - name: Zip app bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "target/release/Impulsor-3000.app" \
            "target/release/Impulsor-3000-macos-arm64.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@v6
        with:
          name: app-macos-arm64
          path: target/release/Impulsor-3000-macos-arm64.zip

  build-linux-x64-appimage:
    runs-on: ubuntu-24.04
    needs: build-linux-x64-binary

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/download-artifact@v5
        with:
          name: binary-linux
          path: ./target/release

      - name: Install AppImageTool
        run: |
          sudo apt update && sudo apt install wget file desktop-file-utils -y
          wget https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x ./appimagetool-x86_64.AppImage
          mv ./appimagetool-x86_64.AppImage ./installer/linux/appimage/appimagetool-x86_64.AppImage

      - name: Build AppImage
        working-directory: ./installer/linux/appimage
        run: |
          bash setup.sh
          ARCH=x86_64 ./appimagetool-x86_64.AppImage Impulsor-3000-x86_64.AppDir --appimage-extract-and-run
          mv Impulsor-3000-x86_64.AppImage Impulsor-3000_x86-64.AppImage

      - name: Upload AppImage
        uses: actions/upload-artifact@v6
        with:
          name: appimage-linux
          path: ./installer/linux/appimage/Impulsor-3000_x86-64.AppImage

  build-windows-x64-installer:
    runs-on: windows-2025
    needs: build-windows-x64-binary

    steps:
      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y

      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/download-artifact@v5
        with:
          name: binary-windows
          path: ./target/release

      - name: Build installer
        working-directory: ./installer/windows
        run: '& "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V4 .\script.nsi'

      - name: Upload installer
        uses: actions/upload-artifact@v6
        with:
          name: installer-windows
          path: ./installer/windows/impulsor3000_setup.exe
