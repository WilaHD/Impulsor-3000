[package]
name = "impulsor3000"
version = "0.4.0"
edition = "2021"
build = "build.rs"
exclude = ["archive"]

[dependencies]
iced = { version = "0.13.1", features = ["svg"] }
pdf_oxide = "0.3.78"
hayro = "0.9.0"
cosmic-text = "0.12.1"
image = "0"
rfd = "0.15"
rust-embed = "8.4.0"
symphonia = { version = "0.5", features = ["all"] }
rusty_mp3 = "1.0.5"
opener = { version = "0.7.2", features = ["reveal"] }
dirs = "4"
serde = { version = "1", features = ["derive"] }
toml = "0.5"

# MP3 encoding is CPU-intensive; keep it optimized in development builds too.
[profile.dev.package.rusty_mp3]
opt-level = 3

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
